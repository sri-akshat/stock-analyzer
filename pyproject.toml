[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analyzer"
version = "0.2.0"
description = "Deploys backtested strategies to suggest investments, with an optional SOTA model consult layer."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
llm = ["openai>=1.40", "anthropic>=0.34"]
sentiment = ["textblob>=0.18"]
dashboard = ["streamlit>=1.36", "plotly>=5.22"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
include = ["stock_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
